<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Temple Dash</title>
<style>
:root{--ink:#fff6e4;--panel:rgba(40,16,48,.6);--gold:#ffd34d;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(#2d2a63 0%,#c4577f 38%,#f2a56e 50%,#f2a56e 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#vg{position:fixed;inset:0;box-shadow:inset 0 0 160px rgba(40,10,50,.55);pointer-events:none}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;font-size:20px;pointer-events:none}
#hud span{background:var(--panel);padding:6px 12px;border-radius:12px}
#fl{position:fixed;inset:0;background:#e0262f;opacity:0;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(40,16,48,.66);text-align:center;padding:20px}
#ov h1{margin:0;font-size:46px;color:var(--gold);text-shadow:0 3px 0 #7a3a1a}
#ov p{margin:0;max-width:320px;line-height:1.45}
#go,#pl,#rsm{height:58px;padding:0 40px;border:0;border-radius:16px;background:var(--gold);color:#3a1a12;font:700 22px "Trebuchet MS",system-ui,sans-serif}
#go:focus-visible,#pl:focus-visible,.sk:focus-visible,#lo:focus-visible{outline:3px solid #fff}
#lo,#lo2,#snd,#rps{height:50px;padding:0 30px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);font:700 18px "Trebuchet MS",system-ui,sans-serif}
#cn{transition:transform .15s}
#lobby{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none}
#lobby>*{pointer-events:auto}
#lt{display:flex;justify-content:space-between;width:100%;max-width:560px;font-weight:700}
#lt span{background:var(--panel);padding:7px 14px;border-radius:12px}
#lh{text-align:center;pointer-events:none!important}
#lh h1{margin:0;font-size:52px;color:var(--gold);text-shadow:0 4px 0 #7a3a1a,0 0 30px rgba(255,200,80,.5)}
#lh p{margin:4px 0 0;opacity:.9}
#sk{display:flex;gap:10px}
.sk{width:96px;padding:10px 6px;border:2px solid transparent;border-radius:14px;background:var(--panel);color:var(--ink);font:700 13px "Trebuchet MS",system-ui,sans-serif;text-align:center}
.sk i{display:block;width:28px;height:28px;margin:0 auto 6px;border-radius:50%}
.sk.on{border-color:var(--gold)}
.dim{opacity:.55}
#lb{display:flex;flex-direction:column;align-items:center;gap:14px}
#bn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 74px);left:0;right:0;text-align:center;font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.5);opacity:0;transition:opacity .5s;pointer-events:none}
#pw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:14px;display:flex;gap:8px;pointer-events:none}#pw b{background:var(--panel);padding:4px 10px;border-radius:12px;font-size:16px;border:2px solid var(--c)}
#pz{pointer-events:auto;height:38px;width:48px;border:0;border-radius:12px;background:var(--panel);color:var(--ink);font-size:18px}
#pse{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(40,16,48,.72)}#pse h1{margin:0 0 8px;font-size:42px;color:var(--gold)}
#tp{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);text-align:center;font-weight:700;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .4s}
#cbo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:14px;font-weight:700;font-size:20px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.6);pointer-events:none}
#nm{position:fixed;left:0;right:0;top:34%;text-align:center;font-weight:700;font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#bars{display:none;position:fixed;inset:0;pointer-events:none}#bars i{position:absolute;left:0;right:0;height:11%;background:#000}#bars i:first-child{top:0}#bars i:last-child{bottom:0}
#stt{position:fixed;left:0;right:0;bottom:calc(11% + 18px);text-align:center;padding:0 24px;font-weight:700;font-size:22px;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.7);pointer-events:none;opacity:0;transition:opacity .3s}
#skp{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 12%);right:14px;height:38px;padding:0 16px;border:0;border-radius:12px;background:var(--panel);color:var(--ink);font:700 15px "Trebuchet MS",system-ui,sans-serif}
#ttl{position:fixed;left:0;right:0;top:30%;text-align:center;font-weight:700;font-size:36px;letter-spacing:.12em;color:var(--gold);text-shadow:0 4px 0 #7a3a1a,0 0 30px rgba(255,200,80,.5);opacity:0;transition:opacity 1s;pointer-events:none}

/* ---- lobby polish ---- */
#lobby{background:linear-gradient(rgba(30,10,45,.6),rgba(30,10,45,0) 30%,rgba(30,10,45,0) 52%,rgba(30,10,45,.78))}
#lt span{background:rgba(30,12,42,.72);border:1px solid rgba(255,211,77,.35);border-radius:999px;padding:8px 16px;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#lc{color:var(--gold)}
#lh{animation:rise .8s both}
#lh h1{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:clamp(46px,14vw,66px);line-height:1;letter-spacing:.02em;background:linear-gradient(#fff3b0,#ffc83d 55%,#ff9a2e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #7a3a1a) drop-shadow(0 0 22px rgba(255,190,70,.55))}
#lh p{margin-top:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.92;text-shadow:0 2px 6px rgba(0,0,0,.55)}
#lh p::before{content:"✦ "}#lh p::after{content:" ✦"}
#lb{gap:16px;width:100%}
#sk{gap:12px;animation:rise .8s .15s both}
.sk{position:relative;width:98px;padding:14px 8px 10px;border:2px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(30,12,42,.78);box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.sk i{width:44px;height:44px;margin:0;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.6),transparent 55%),var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.22),inset -4px -6px 10px rgba(0,0,0,.3),0 0 18px var(--c)}
.sk .nm{font-size:14px}
.sk .st{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);letter-spacing:.04em}
.sk.on{border-color:var(--gold);transform:translateY(-5px);box-shadow:0 10px 26px rgba(255,200,60,.35),0 0 0 1px rgba(255,211,77,.4)}
.sk.on .st{background:var(--gold);color:#3a1a12}
.sk:active{transform:scale(.96)}
#pl{min-width:230px;height:64px;border-radius:999px;font-size:26px;letter-spacing:.06em;background:linear-gradient(#ffe88a,#ffb52e);box-shadow:0 6px 0 #a8620f,0 12px 30px rgba(255,180,50,.45);animation:rise .8s .3s both,pulse 2.2s 1.2s ease-in-out infinite;transition:box-shadow .1s}
#pl:active{transform:translateY(5px);box-shadow:0 1px 0 #a8620f,0 4px 14px rgba(255,180,50,.4);animation:none}
#rps{height:38px;padding:0 20px;border-radius:999px;font-size:14px;background:transparent;border:1px solid rgba(255,246,228,.35);animation:rise .8s .45s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.045)}}
@media(prefers-reduced-motion:reduce){#lh,#sk,#pl,#rps{animation:none}}

/* ---- icons ---- */
.cI{display:inline-block;position:relative;width:1em;height:1em;border-radius:50%;margin-right:.4em;vertical-align:-.16em;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd34d 45%,#e08a00);box-shadow:0 0 0 .09em #ffe27a,inset 0 0 0 .14em rgba(160,80,0,.4),0 0 8px rgba(255,200,60,.55)}
.cI::after{content:"";position:absolute;inset:31%;background:#fff6c8;transform:rotate(45deg);border-radius:1px;box-shadow:0 0 0 1px rgba(160,80,0,.35)}
#cn,#lc{display:inline-flex;align-items:center}
#cn b#cv,#cn .cI{font-weight:700}
#cn .cI{font-size:22px}
#pz{display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,211,77,.35);}
#pz svg{fill:var(--gold);filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
#pz:active{transform:scale(.92)}
#hud span{border:1px solid rgba(255,211,77,.25);}
.ar{width:1.3em;height:1.3em;vertical-align:-.3em;margin:0 .2em;fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.pi{width:17px;height:17px;fill:var(--c);vertical-align:-3px;margin-right:5px;filter:drop-shadow(0 0 4px var(--c))}
.lk{width:12px;height:12px;fill:currentColor;vertical-align:-1px;margin-right:4px}
.sk .st .cI{font-size:11px;margin-right:.3em}

.mr{display:flex;gap:10px}
.mb{position:relative;height:44px;padding:0 18px;border:1px solid rgba(255,211,77,.35);border-radius:999px;background:rgba(30,12,42,.78);color:var(--ink);font:700 15px "Trebuchet MS",system-ui,sans-serif;display:flex;align-items:center;gap:8px}
.mb svg{width:18px;height:18px;fill:var(--gold)}
.mb em{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#e0262f;font-style:normal;font-size:12px;display:none;align-items:center;justify-content:center}
#pn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,10,45,.8);padding:16px;z-index:5}
#pc{width:100%;max-width:400px;max-height:88%;overflow-y:auto;touch-action:pan-y;background:#2b1236;border:1px solid rgba(255,211,77,.4);border-radius:22px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#pc h2{margin:0 0 12px;color:var(--gold);font-size:26px;text-align:center}
.tr{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.tt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffe27a,#ffb52e)}
.tr button,#pcl{height:34px;border:0;border-radius:10px;padding:0 14px;background:var(--gold);color:#3a1a12;font:700 14px "Trebuchet MS",system-ui,sans-serif}
.tr button[disabled]{opacity:.45}
#pcl{height:44px;width:100%;margin-top:6px;background:rgba(255,255,255,.14);color:var(--ink)}
.lr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:15px}.lr.me{background:rgba(255,211,77,.2);outline:1px solid var(--gold)}.lr b{width:24px;color:var(--gold)}.lr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lr em{font-style:normal;font-weight:700}
.nt{opacity:.75;font-size:13px;text-align:center;margin:8px 0}
#pc input{width:100%;box-sizing:border-box;height:42px;border-radius:10px;border:1px solid rgba(255,211,77,.4);background:rgba(255,255,255,.1);color:var(--ink);padding:0 12px;font-size:16px;user-select:text;-webkit-user-select:text}.sv{height:38px;margin:8px 0 12px;border:0;border-radius:10px;padding:0 18px;background:var(--gold);color:#3a1a12;font:700 15px "Trebuchet MS",sans-serif}
#od{white-space:pre-line}
.sv{display:block;width:100%}.sv[disabled]{opacity:.45}
.md{display:block;width:100%;margin-bottom:10px;padding:14px;border:1px solid rgba(255,211,77,.35);border-radius:16px;background:rgba(255,255,255,.08);color:var(--ink);text-align:left;font:700 18px "Trebuchet MS",sans-serif}
.md span{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:2px}
.gb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border:0;border-radius:999px;background:#fff;color:#3c4043;font:700 16px Roboto,"Trebuchet MS",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.gh{background:rgba(255,255,255,.14);color:var(--ink)}.dg{background:#e0262f;color:#fff}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#4a2a5a;flex:none}
.me2{display:flex;align-items:center;gap:12px;margin-bottom:10px}.me2 small{display:block;opacity:.7;font-size:12px}
.gb2{margin-left:auto;height:34px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--ink);font:700 13px "Trebuchet MS",sans-serif}
#mpb{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:14px;font-weight:700;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.7);pointer-events:none;line-height:1.5}
</style>
</head>

function resume(){if(mode!=='pause')return;$('pse').style.display='none';run=true;mode='play'}
$('pz').onclick=pause;$('rsm').onclick=resume;$('snd').onclick=()=>{S.mute=!S.mute;save();$('snd').textContent=S.mute?'Sound: Off':'Sound: On'};$('lo2').onclick=()=>{$('pse').style.display='none';toLobby()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
$('go').onclick=start;$('pl').onclick=modePanel;$('rps').onclick=story;$('skp').onclick=()=>{if(mode==='story')endStory()};$('lo').onclick=toLobby;skin();lobbyUI();$('hud').style.display='none';
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key;initA();if(k==='p'||k==='Escape'){mode==='pause'?resume():pause()}
 if(k==='ArrowLeft'||k==='a')act('l');else if(k==='ArrowRight'||k==='d')act('r');
 else if(k==='ArrowUp'||k==='w'||k===' ')act('u');else if(k==='ArrowDown'||k==='s')act('d');
 if(k===' ')e.preventDefault()});
let sx=0,sy=0,sdone=true,mv=false;
addEventListener('pointerdown',e=>{initA();sx=e.clientX;sy=e.clientY;sdone=!!(e.target.closest&&e.target.closest('button'));mv=false});
addEventListener('pointermove',e=>{if(sdone)return;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))>26){mv=true;sdone=true;if(Math.abs(dx)>Math.abs(dy))act(dx<0?'l':'r');else act(dy<0?'u':'d')}});
addEventListener('pointerup',e=>{if(!sdone&&!mv)act('u');sdone=true});addEventListener('pointercancel',()=>{sdone=true});
document.addEventListener('contextmenu',e=>e.preventDefault());
requestAnimationFrame(frame);
</script>
</body>
